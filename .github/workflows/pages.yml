name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Elm
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://github.com/elm/compiler/releases/download/0.19.2/elm-0.19.2-linux-x64.gz | gunzip > "$HOME/bin/elm"
          chmod +x "$HOME/bin/elm"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/elm" --version

      - uses: actions/cache@v4
        with:
          path: ~/.elm
          key: elm-${{ hashFiles('elm.json') }}

      - name: Build
        run: make build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
